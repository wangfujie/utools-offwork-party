<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>趣味闹钟 · 该回到生活了</title><link rel="stylesheet" href="overlay.css"></head>
<body>
  <div class="backdrop"></div><canvas id="confetti"></canvas>
  <div class="overlay-top"><span>FUN ALARM <i>✦</i> 趣味闹钟</span><button id="close" aria-label="关闭动画">✕ <small>ESC</small></button></div>
  <main class="stage"><div class="stage-art" id="scene"></div><div class="words"><div class="scene-caption" id="caption"></div><h1 id="big-title"></h1><p id="message"></p><div class="message-line"></div><span class="small-note">今天辛苦了，接下来是你的时间。</span></div></main>
  <div class="overlay-bottom"><div class="session-label"><span id="mode">提醒时间到</span><small>A LITTLE JOY. RIGHT ON TIME.</small></div><div class="actions"><span id="remaining"></span><button id="snooze">再过 10 分钟</button><button id="leave">收到，出发 ↗</button></div></div>
  <div class="progress" id="progress"></div>
  <script src="core.js"></script><script src="scenes.js"></script><script src="overlay.js"></script>
</body>
</html>
